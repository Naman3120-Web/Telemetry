name: Keep Render App Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Triggers every 10 minutes
  workflow_dispatch:      
jobs:
  ping-job:
    runs-on: ubuntu-latest

    steps:
      - name: Send Secure Ping Request
        run: |
          curl -s "${{ secrets.APP_URL }}" > /dev/null
          echo "Secure ping sent successfully!"
